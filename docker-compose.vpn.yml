# The app has NO direct internet access: it only sits on the isolated network (no
# egress route). Its only way out is the gateway, which forwards through lanepool's
# Surfshark exits using one sticky session and rotates to a new exit if it dies.
# If the gateway or lanepool is down, the bot simply can't connect (fail closed).
# Bot settings come from .env (Dokploy "Create Environment File").
services:
  gateway:
    build: ./gateway
    environment:
      LANEPOOL_URL: ${LANEPOOL_URL:-lanepool:8080}
      LANEPOOL_USER: ${LANEPOOL_USER}
      LANEPOOL_PASS: ${LANEPOOL_PASS}
      LANEPOOL_COUNTRY: ${LANEPOOL_COUNTRY:-}
      SESSION_TTL_MIN: ${SESSION_TTL_MIN:-1440}
      WEB_TARGET: app:80
      PROWLARR_TARGET: ${PROWLARR_TARGET:-prowlarr:9696}
    networks:
      - dokploy-network
      - isolated
    restart: unless-stopped

  app:
    build: .
    command: bash start.sh
    depends_on:
      - gateway
      - mongo
      - torrentapi
    env_file:
      - .env
    environment:
      UPSTREAM_REPO: ""
      # Every client is pointed at the gateway; nothing else is reachable anyway
      EGRESS_PROXY: http://gateway:1080
      HTTP_PROXY: http://gateway:1080
      HTTPS_PROXY: http://gateway:1080
      ALL_PROXY: http://gateway:1080
      http_proxy: http://gateway:1080
      https_proxy: http://gateway:1080
      all_proxy: http://gateway:1080
      NO_PROXY: localhost,127.0.0.1,::1,mongo,gateway,torrentapi,172.31.78.0/24
      no_proxy: localhost,127.0.0.1,::1,mongo,gateway,torrentapi,172.31.78.0/24
      RCLONE_SFTP_SOCKS_PROXY: gateway:1080
      TG_PROXY: '{"scheme": "socks5", "hostname": "gateway", "port": 1080}'
      PROWLARR_URL: http://gateway:9696
      QB_PROXY_HOST: gateway
      QB_PROXY_PORT: "1080"
      # Uploads to arr:/arr-import/{movies,tv} land in the host folder Radarr/Sonarr
      # see as /downloads/mltb, then get imported and renamed by them
      ARR_LOCAL_DIR: /arr-import
      ARR_REMOTE_DIR: /downloads/mltb
    volumes:
      - ${ARR_HOST_DIR:-/opt/qbit-downloads/mltb}:/arr-import
    networks:
      isolated:
        ipv4_address: 172.31.78.20
    restart: unless-stopped

  torrentapi:
    # Torrent search API (Ryuk-me/Torrent-Api-py); scrapes sites through the gateway
    build: https://github.com/Ryuk-me/Torrent-Api-py.git#1a302617686b22714eacf60cc8d215bbd5979ffe
    environment:
      HTTP_PROXY: http://gateway:1080
      HTTPS_PROXY: http://gateway:1080
    networks:
      isolated:
        ipv4_address: 172.31.78.30
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: mltb
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      isolated:
        ipv4_address: 172.31.78.10
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
  isolated:
    internal: true
    ipam:
      config:
        - subnet: 172.31.78.0/24

volumes:
  mongo-data:
