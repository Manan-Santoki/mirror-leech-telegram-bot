# All bot traffic (Telegram, aria2, qBittorrent, SABnzbd, yt-dlp, uploads) is routed
# through Gluetun. Gluetun's firewall blocks traffic if the VPN drops, and the bot
# refuses to start and binds aria2/qBittorrent to VPN_INTERFACE as a second layer.
# Keep UPSTREAM_REPO empty (or point it at this fork) so update.py doesn't overwrite this.
services:
  gluetun:
    image: qmcgaw/gluetun:v3.40.0
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-protonvpn}
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-Netherlands}
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING:-on}
      # Allow Traefik (Dokploy domain) to reach the web UI on BASE_URL_PORT
      FIREWALL_INPUT_PORTS: ${BASE_URL_PORT:-80}
    # Ports for the bot must be published here, never on the mltb service.
    # Prefer a Dokploy domain on this service (port 80) over publishing ports.
    restart: unless-stopped

  app:
    build: .
    command: bash start.sh
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      VPN_INTERFACE: tun0
      BOT_TOKEN: ${BOT_TOKEN}
      OWNER_ID: ${OWNER_ID}
      TELEGRAM_API: ${TELEGRAM_API}
      TELEGRAM_HASH: ${TELEGRAM_HASH}
      USER_SESSION_STRING: ${USER_SESSION_STRING:-}
      DATABASE_URL: ${DATABASE_URL:-}
      BASE_URL: ${BASE_URL:-}
      BASE_URL_PORT: ${BASE_URL_PORT:-80}
      AUTHORIZED_CHATS: ${AUTHORIZED_CHATS:-}
      SUDO_USERS: ${SUDO_USERS:-}
      UPSTREAM_REPO: ""
    restart: unless-stopped
